    - {name: age 63 not eligible before, scheme: mh.ladki_bahin, date: "2024-07-01", eligible: false, person: {age: 63, gender: female, annual_family_income: 150000}}
    - {name: unmarried eligible after, scheme: mh.ladki_bahin, date: "2024-07-10", eligible: true, person: {age: 25, gender: female, marital_status: unmarried, annual_family_income: 150000}}
    - {name: second unmarried woman not eligible, scheme: mh.ladki_bahin, date: "2024-07-10", eligible: false, person: {age: 25, gender: female, marital_status: unmarried, other_unmarried_beneficiary_in_family: true, annual_family_income: 150000}}
    - {name: married woman unaffected by unmarried rule, scheme: mh.ladki_bahin, date: "2024-07-10", eligible: true, person: {age: 40, gender: female, marital_status: married, other_unmarried_beneficiary_in_family: true, annual_family_income: 150000}}
    - {name: contract worker family eligible after, scheme: mh.ladki_bahin, date: "2024-07-10", eligible: true, person: {age: 40, gender: female, family_govt_job: contract, annual_family_income: 200000}}
