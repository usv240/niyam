id: mh-lb-2024-07-03-amendment
kind: real
description: >
  Real amendment to Ladki Bahin (GR 202407031335114330, 3 July 2024). Six
  eligibility changes, one of which narrows eligibility, so it must go to a
  human. Labels written by hand from the GR text (pages 1 to 3).
meta:
  title: Ladki Bahin amendment, 3 July 2024
  published_at: "2024-07-03"
  code: "202407031335114330"
  source_url: https://gr.maharashtra.gov.in/Site/Upload/Government%20Resolutions/Marathi/202407031335114330.pdf
base_ref: baseline-2024-06-28
expect:
  relevant: true
  schemes: [mh.ladki_bahin]
  changes:
    - {target: age_max, change_type: parameter_update, new_value: 65, boundary: inclusive}       # row 3, clause 4(3)
    - {target: eligible_marital_statuses, change_type: parameter_update,
       new_value: [married, widowed, divorced, abandoned, destitute, unmarried]}                     # rows 1 and 2
    - {target_contains: unmarried, change_type: [condition_added, condition_changed]}             # one unmarried woman per family
    - {target: disqualifying_govt_jobs, change_type: parameter_update, new_value: [regular, pensioner]}  # row 4, clause 5(3)
    - {target: other_scheme_limit, change_type: [condition_changed, parameter_update], boundary: exclusive}  # row 5, "Rs 1,500 or more"
    - {target: farm_land_limit, change_type: condition_removed}                                   # row 6, clause 5(7)
  min_ambiguities: 1
  decision_in: [human_review, needs_human]
  outcomes:
    - {name: age 65 eligible after, scheme: mh.ladki_bahin, date: "2024-07-10", eligible: true, person: {age: 65, gender: female, annual_family_income: 150000}}
