id: mh-sgn-2023-07-06-increase
kind: real
description: >
  Real order (GR 202307061137387522, 6 July 2023) raising Sanjay Gandhi
  Niradhar Anudan Yojana assistance to Rs 1,500 a month, applied on top of the
  agent's own onboarding of the scheme from the 2019 consolidated GR (tag
  sgn-onboarded, PR #3). Only amounts rise and nobody loses eligibility, so the
  trust policy allows acting alone. Labels from pages 1 and 2 of the GR.
