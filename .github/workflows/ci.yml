name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  agent:
    runs-on: ubuntu-latest
    env:
      NEATLOGS_API_KEY: ""          # tests never send traces
      NIYAM_RULEBOOK_PATH: ${{ github.workspace }}/niyam-rulebook
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: usv240/niyam-rulebook
          path: niyam-rulebook
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e agent pytest
      - run: pytest -q agent/tests

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: No emojis, no em or en dashes in public copy
        run: node scripts/content-lint.mjs
      - run: npx next build
